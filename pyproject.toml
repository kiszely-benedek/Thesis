[project]
name = "plantgraph"
version = "0.1.0"
description = "GraphRAG at plant scale for P&ID engineering diagrams"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "networkx>=3.4",
    "pillow>=11.0",
    "pydexpi==1.2.0",
    "neo4j>=6.3.1",
    "python-dotenv>=1.2.3",
    "openai>=3.19.2",
    "fpdf2>=2.8.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-networkx>=3.6.1.20260903",
    "pypdf>=6.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plantgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_llm: makes a real, paid OpenRouter call; runs only with --live-llm (see tests/conftest.py)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.format]
# adattáblák: egy csatlakozó = egy sor; a formázó szétdobná őket soronként egy mezőre
exclude = [
    "src/plantgraph/benchmark/open100/annotations.py",
    "src/plantgraph/benchmark/open100/manifest.py",
]

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle, I: import order, UP: modern syntax, B: bugbear,
# D: docstring presence (Google style — a professor reads this code)
select = ["E", "F", "I", "UP", "B", "D"]
# UP042 (str, Enum) -> StrEnum: szándékosan kikapcsolva. A StrEnum megváltoztatja, mit ad a
# str() és az f-string egy enum-tagra, és ez manifesztekbe és tagekbe kerül — viselkedésváltozás lenne.
ignore = ["D100", "D104", "D105", "D107", "D203", "D213", "UP042"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
# adattáblák: egy csatlakozó = egy sor, a hosszú megjegyzés hozzátartozik
"src/plantgraph/benchmark/open100/annotations.py" = ["E501"]
"src/plantgraph/benchmark/open100/manifest.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# pyDEXPI 1.2.0 nem ad ki py.typed jelzőt (ellenőrizve 2026-09-13), ezért
# mypy nem talál hozzá típusinformációt; a mi kódunk marad --strict.
# implicit_reexport: a pyDEXPI-csomagok egy része __init__.py-ban re-exportál
# explicit __all__ nélkül (pl. ProteusSerializer) — ez pyDEXPI-oldali szokás,
# nem valami, amit a mi --strict beállításunknak kifogásolnia kéne.
module = ["pydexpi", "pydexpi.*"]
follow_untyped_imports = true
implicit_reexport = true
