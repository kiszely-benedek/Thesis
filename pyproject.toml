[project]
name = "plantgraph"
version = "0.1.0"
description = "GraphRAG at plant scale for P&ID engineering diagrams"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10",
    "networkx>=3.4",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-networkx>=3.6.1.20260903",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plantgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.format]
# adattáblák: egy csatlakozó = egy sor; a formázó szétdobná őket soronként egy mezőre
exclude = [
    "src/plantgraph/benchmark/open100/annotations.py",
    "src/plantgraph/benchmark/open100/manifest.py",
]

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle, I: import order, UP: modern syntax, B: bugbear,
# D: docstring presence (Google style — a professor reads this code)
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D100", "D104", "D105", "D107", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
# adattáblák: egy csatlakozó = egy sor, a hosszú megjegyzés hozzátartozik
"src/plantgraph/benchmark/open100/annotations.py" = ["E501"]
"src/plantgraph/benchmark/open100/manifest.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
