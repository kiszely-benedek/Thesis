[project]
name = "plantgraph"
version = "0.1.0"
description = "GraphRAG at plant scale for P&ID engineering diagrams"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10",
    "networkx>=3.4",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plantgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
