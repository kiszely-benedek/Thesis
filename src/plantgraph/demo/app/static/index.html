<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Plant-scale P&amp;ID demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/card.css">
  <link rel="stylesheet" href="/static/results.css">
</head>
<body>
  <a id="skip-link" class="skip" href="#question-text"></a>
  <!-- The title block: what a drawing's corner box is to a P&ID, this strip is to the page. -->
  <header class="titleblock">
    <div class="tb-cell tb-title"><h1 id="title"></h1></div>
    <div class="tb-cell tb-plant">
      <span class="field-label" id="plant-caption"></span>
      <div id="plant-switch" class="segmented" role="radiogroup" aria-labelledby="plant-caption"></div>
    </div>
    <div class="tb-cell">
      <span class="field-label" id="held-caption"></span>
      <span class="tb-value mono" id="held-value"></span>
    </div>
    <div class="tb-cell" id="spend-cell">
      <span class="field-label" id="spend-caption"></span>
      <span class="tb-value mono" id="spend-value"></span>
    </div>
    <div class="tb-cell tb-tabs">
      <div class="tabs" role="tablist" id="tablist">
        <button id="tab-ask" type="button" role="tab" class="tab" aria-selected="true" aria-controls="ask-view"></button>
        <button id="tab-results" type="button" role="tab" class="tab" aria-selected="false" aria-controls="results-view"
                tabindex="-1"></button>
      </div>
    </div>
    <div class="tb-menu">
      <button id="menu-toggle" type="button" class="icon-button menu-toggle" aria-expanded="false"
              aria-controls="tools">&#8943;</button>
      <div id="tools" class="tools">
        <button id="present-open" type="button" class="text-button"></button>
        <button id="intro-open" type="button" class="text-button" aria-pressed="true"></button>
        <button id="theme-toggle" type="button" class="icon-button"></button>
      </div>
    </div>
  </header>

  <!-- Presentation mode: the step bar under the header (hidden until "Present"). -->
  <nav id="present-bar" class="present-bar" hidden>
    <div class="present-row">
      <span id="present-counter" class="present-counter mono"></span>
      <span id="present-title" class="present-title"></span>
      <div id="present-sequences" class="present-sequences"></div>
      <div class="present-nav">
        <button id="present-back" type="button" class="text-button"></button>
        <button id="present-next" type="button" class="primary"></button>
        <button id="present-exit" type="button" class="text-button"></button>
      </div>
    </div>
    <p id="present-question" class="present-question"></p>
    <p id="present-note" class="hint" role="status"></p>
  </nav>

  <main id="ask-view" class="layout" role="tabpanel" aria-labelledby="tab-ask">
    <!-- Left: the drawing set in the browser's own PDF viewer (the paper stays white). -->
    <section class="drawings" aria-label="Drawings">
      <div class="drawings-bar">
        <label for="dwg-input" id="dwg-label"></label>
        <!-- One box: a sheet number jumps, a tag shows its card, a prefix lists matching tags. -->
        <div class="find">
          <input id="dwg-input" type="text" size="18" maxlength="64" autocomplete="off" spellcheck="false"
                 role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="find-list">
          <ul id="find-list" class="find-list" role="listbox" hidden></ul>
        </div>
        <button id="dwg-go" type="button" class="text-button"></button>
        <span id="dwg-message" class="hint" role="status"></span>
      </div>
      <div id="find-card" class="find-card" hidden></div>
      <div id="pdf-host" class="pdf-host"></div>
    </section>

    <!-- Right: what this is, the plant load, the question, the answer. -->
    <section class="panel" aria-label="Question and answer">
      <aside id="intro" class="intro"></aside>

      <div id="plant-phase" class="phase" role="status">
        <span id="plant-phase-text"></span>
        <div id="plant-phase-bar" class="bar" hidden></div>
      </div>
      <div id="store-notice" class="notice" role="status" hidden></div>
      <div id="corpus-state" class="hint" hidden></div>

      <div class="ask">
        <label for="question-text" id="question-label" class="field-label"></label>
        <textarea id="question-text" rows="3"></textarea>
        <div id="ask-bar" class="bar" hidden></div>
        <div class="ask-row">
          <button id="ask-button" type="button" class="primary"></button>
          <span id="ask-status" class="hint" role="status"></span>
          <span id="ask-keys" class="hint ask-keys"></span>
        </div>
        <div id="ask-progress" aria-live="polite"></div>
        <div id="message" class="message" role="alert" hidden></div>
      </div>

      <details id="examples" class="examples" open>
        <summary id="examples-summary"></summary>
        <div id="examples-list"></div>
      </details>

      <div id="result" aria-live="polite"></div>
    </section>
  </main>

  <!-- The Results tab replaces both columns: the charts need the width. -->
  <main id="results-view" class="results" role="tabpanel" aria-labelledby="tab-results" hidden>
    <h2 id="results-heading" class="results-title"></h2>
    <p id="results-intro" class="results-intro"></p>
    <div id="results-status" class="hint" role="status"></div>
    <div id="results-body"></div>
  </main>

  <!-- The one shared tooltip of the glossary words (glossary.js moves and fills it). -->
  <div id="glossary-tip" class="glossary-tip" role="tooltip"></div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
